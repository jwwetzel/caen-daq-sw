[project]
name = "dt5742b-daq"
dynamic = ["version"]
description = "Dead-simple, fast, bulletproof DAQ for the CAEN DT5742B"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Neuhaus", email = "jneuhaus@coe.edu" }]
keywords = ["daq", "caen", "dt5742b", "drs4", "digitizer", "physics"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    # ROOT output without a ROOT install: uproot writes TTrees in pure Python,
    # so the Windows DAQ box needs no CERN software stack.
    "uproot>=5",
    # Tray icon. Windows only on purpose: it is the deployment target, and on
    # Linux pystray wants an X display that the headless DAQ box does not have.
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]

# The smoke tests drive the API through starlette's TestClient, which needs an
# HTTP client that is NOT a runtime dependency — keep it out of the operator
# install, which should stay lean.
[project.optional-dependencies]
test = ["httpx2"]

[project.urls]
Homepage = "https://github.com/jneuhaus-coe/caen-daq-sw"
Source = "https://github.com/jneuhaus-coe/caen-daq-sw"
Issues = "https://github.com/jneuhaus-coe/caen-daq-sw/issues"

[project.scripts]
daq = "daq.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "daq.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["daq*"]

# The built web UI lives under daq/static/ and is NOT an importable package, so
# `packages.find` cannot see it. Without this the wheel installs a server that
# serves a 404 for its own UI. The release workflow asserts index.html is in the
# wheel so this can never silently regress.
[tool.setuptools.package-data]
daq = ["static/index.html", "static/**/*", "sounds/*.wav"]
